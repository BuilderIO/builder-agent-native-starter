name: Sync template into main

# Vendor-branch mirror (starter side). Agent-Native materializes its bundled
# `builder-code-starter` template
# (packages/core/src/templates/builder-code-starter) and pushes it to this
# repo's `template` branch; this workflow git-merges that branch into `main`,
# preserving the private customization layer. The starter is edited in
# Agent-Native, not patched here.
#
# It lives on the `template` branch ONLY (never `main`) so it doesn't ship in a
# clone of the default branch. Because it runs on push to `template` and only
# GITHUB_TOKEN is used to push `main`, there's no recursion.
on:
  push:
    branches: [template]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: starter-template-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge template into main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history for the merge base)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0

      - name: Skip when already synced or a conflict PR is open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Back-to-back pushes to template queue behind the concurrency group;
          # the earlier run fetches the newer tip and merges it, leaving this run
          # an empty merge that `git commit --no-edit` rejects.
          git fetch origin template
          if git merge-base --is-ancestor origin/template HEAD; then
            echo "main already contains origin/template; nothing to sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open=$(gh pr list --label sync-conflict --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "A sync-conflict PR is already open; skipping until it is resolved."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: "24"
          cache: pnpm

      - name: Merge template into main
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          SNAPSHOT_API_URL: https://api.builder.io/projects/bffe4b2ed2f34eafaf69/snapshots
          GOLDEN_TEMPLATE_ID: agent-native-starter
          BUILDER_PROJECT_API_KEY: ${{ secrets.BUILDER_PROJECT_API_KEY }}
          BUILDER_SUPERUSER_TOKEN: ${{ secrets.BUILDER_SUPERUSER_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "builder-bot"
          git config user.email "noreply@builder.io"
          git fetch origin template

          git merge --no-commit --no-ff origin/template \
            || echo "Merge reported conflicts; resolving .github/ then evaluating."

          # The sync workflow lives on the template branch only and must never
          # land on main (main ships in clones).
          git rm -r --cached --ignore-unmatch --quiet .github || true
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq .github || true

          conflicts=$(git diff --name-only --diff-filter=U || true)
          if [ -z "$conflicts" ]; then
            echo "Clean merge."
          elif [ "$conflicts" = "pnpm-lock.yaml" ]; then
            echo "pnpm-lock.yaml conflict — regenerating."
            git checkout --ours pnpm-lock.yaml
            pnpm install --lockfile-only
            git add pnpm-lock.yaml
          else
            echo "Conflicts need manual resolution:"
            echo "$conflicts"
            git merge --abort
            branch="sync/template-${SHA::7}"
            git checkout -b "$branch"
            git merge --no-edit origin/template || true
            git add -A
            git commit -m "conflict: template sync needs manual resolution"
            git push origin "$branch"
            gh label create sync-conflict --force >/dev/null 2>&1 || true
            printf 'Automated template sync hit conflicts that need manual resolution:\n\n```\n%s\n```\n' "$conflicts" \
              | gh pr create --base main --head "$branch" \
                  --title "Template sync conflict (${SHA::7})" \
                  --label sync-conflict --body-file -
            exit 1
          fi

          pnpm install --no-frozen-lockfile
          pnpm exec agent-native skills update scaffold --project \
            || echo "::warning::skills update scaffold failed; main keeps the template branch's skills"

          # --no-frozen-lockfile keeps every pin that still satisfies its range
          # and only resolves what changed, so a core bump gets a fresh copy of a
          # shared dependency while main's lockfile holds the app on an older one.
          # Two copies of a type-bearing package (zod) are nominally distinct to
          # TypeScript, and typecheck fails on schemas handed to the framework.
          # Dedupe collapses them onto one version. It only rewrites the
          # lockfile -- package.json is mirror-owned, so nothing here may touch
          # it -- and must run before the commit so main records the deduped tree.
          pnpm dedupe
          git add -A
          git commit --no-edit

          pnpm typecheck
          pnpm build
          pnpm exec agent-native doctor || echo "::warning::agent-native doctor reported findings"

          git push origin main

          pushed_main_sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ ! "$pushed_main_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve the full pushed main commit SHA"
            exit 1
          fi

          remote_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [ "$remote_main_sha" != "$pushed_main_sha" ]; then
            echo "::error::origin/main does not match the commit that was just pushed"
            exit 1
          fi

          # Requested inline rather than by dispatching a workflow on main: main
          # ships in every clone, so it must carry no workflow files at all.
          if [ -z "${BUILDER_PROJECT_API_KEY:-}" ]; then
            echo "::error::Required repository secret BUILDER_PROJECT_API_KEY is not configured."
            exit 1
          fi
          if [ -z "${BUILDER_SUPERUSER_TOKEN:-}" ]; then
            echo "::error::Required repository secret BUILDER_SUPERUSER_TOKEN is not configured."
            exit 1
          fi

          api_key_encoded=$(jq -rn --arg value "$BUILDER_PROJECT_API_KEY" '$value | @uri')
          template_id_encoded=$(jq -rn --arg value "$GOLDEN_TEMPLATE_ID" '$value | @uri')
          request_url="${SNAPSHOT_API_URL}?apiKey=${api_key_encoded}&goldenTemplateId=${template_id_encoded}"
          request_body=$(jq -cn --arg sourceCommitSha "$pushed_main_sha" '{sourceCommitSha: $sourceCommitSha}')

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${BUILDER_SUPERUSER_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$request_body" \
            "$request_url")

          trigger_event_id=$(jq -er '.triggerEventId | select(type == "string" and length > 0)' <<<"$response")
          check_run_id=$(jq -er '.checkRunId | select(type == "number" and . > 0 and . == floor)' <<<"$response")

          {
            echo "## Golden Snapshot request accepted"
            echo
            echo "The backend accepted trigger \`$trigger_event_id\` and created Golden Snapshot check run \`$check_run_id\`."
            echo "Final status will appear in the **Golden Snapshot** check and Slack."
          } >> "$GITHUB_STEP_SUMMARY"
  notify-failure:
    name: Notify Slack on sync failure
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID}"

          # Build the payload with jq so special characters in the branch/sha
          # can't produce invalid JSON.
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg url "$WORKFLOW_URL" \
            '{
              attachments: [
                {
                  color: "#FF0000",
                  title: "❌ Starter template sync failed",
                  text: ("The `Sync template into main` workflow failed for `" + $repo + "` at `" + $sha[0:7] + "`.\n\n<" + $url + "|View run>")
                }
              ]
            }' > /tmp/slack-payload.json

          curl -X POST -H 'Content-type: application/json' \
            --data @/tmp/slack-payload.json "$SLACK_WEBHOOK_URL"
