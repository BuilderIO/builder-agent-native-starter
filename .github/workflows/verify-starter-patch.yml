name: Verify starter patch

# Runs on PRs into `template` so overlay drift is caught before the next
# template → main sync. Lives on the template branch with the overlay.
on:
  pull_request:
    branches: [template]
  workflow_dispatch:

jobs:
  verify:
    name: Apply overlay onto this tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Apply overlay to pristine and previously patched trees
        run: |
          set -euo pipefail
          source="$(mktemp -d)"
          git archive HEAD | tar -x -C "$source"
          patch="$source/.github/starter-patch/apply.mjs"

          assert_idempotent() {
            local root="$1"
            git -C "$root" init -q
            git -C "$root" config user.name "starter-patch-test"
            git -C "$root" config user.email "noreply@builder.io"
            git -C "$root" add -A
            git -C "$root" commit -qm "patched snapshot"
            node "$patch" --root "$root"
            git -C "$root" diff --exit-code
            test -z "$(git -C "$root" status --porcelain)"
          }

          pristine="$(mktemp -d)"
          git archive HEAD | tar -x -C "$pristine"
          node "$patch" --root "$pristine"
          test -f "$pristine/app/routes/_index.tsx"
          grep -q "Your app here" "$pristine/app/routes/_index.tsx"
          ! grep -q "<AgentSidebar" "$pristine/app/components/layout/Layout.tsx"
          test ! -e "$pristine/CHANGELOG.md"
          test ! -d "$pristine/app/i18n"
          test -f "$pristine/drizzle/START_HERE.md"
          grep -q '"db:migrate": "drizzle-kit migrate"' "$pristine/package.json"
          grep -q '"drizzle-orm": "0.45.2"' "$pristine/package.json"
          grep -q '"dev": "agent-native dev"' "$pristine/package.json"
          ! grep -q 'agent-native dev --open' "$pristine/package.json"
          grep -q 'pnpm migrate:production && pnpm db:migrate' "$pristine/netlify.toml"
          grep -q 'managed Drizzle scaffold is the only app migration path' "$pristine/.agents/skills/storing-data/SKILL.md"
          grep -q 'This entrypoint owns framework tables only' "$pristine/scripts/migrate-production.ts"
          grep -q 'must run as its own process' "$pristine/scripts/migrate-production.ts"
          grep -q '"@agent-native/\*"' "$pristine/pnpm-workspace.yaml"
          grep -q 'Before enabling authentication, inspect `app/routes`' "$pristine/AGENTS.md"
          grep -q 'Never assume `/home` unless that' "$pristine/AGENTS.md"
          grep -q 'app: { homePath: "/dashboard" }' "$pristine/AGENTS.md"
          ! grep -q 'homePath' "$pristine/server/plugins/config.ts"
          assert_idempotent "$pristine"

          git fetch origin main
          migrated="$(mktemp -d)"
          git archive origin/main | tar -x -C "$migrated"
          node "$patch" --root "$migrated" --source-root "$source"
          test "$(grep -c 'This starter ships as a blank Agent-Native app canvas' "$migrated/AGENTS.md")" = 1
          test "$(grep -c '^\*\*Do not add internationalization or changelog support' "$migrated/AGENTS.md")" = 1
          grep -q '"db:migrate": "drizzle-kit migrate"' "$migrated/package.json"
          grep -q '"drizzle-orm": "0.45.2"' "$migrated/package.json"
          grep -q '"dev": "agent-native dev"' "$migrated/package.json"
          ! grep -q 'agent-native dev --open' "$migrated/package.json"
          grep -q 'pnpm migrate:production && pnpm db:migrate' "$migrated/netlify.toml"
          grep -q 'managed Drizzle scaffold is the only app migration path' "$migrated/.agents/skills/storing-data/SKILL.md"
          grep -q 'This entrypoint owns framework tables only' "$migrated/scripts/migrate-production.ts"
          grep -q 'must run as its own process' "$migrated/scripts/migrate-production.ts"
          grep -q '"@agent-native/\*"' "$migrated/pnpm-workspace.yaml"
          grep -q 'Before enabling authentication, inspect `app/routes`' "$migrated/AGENTS.md"
          grep -q 'Never assume `/home` unless that' "$migrated/AGENTS.md"
          grep -q 'app: { homePath: "/dashboard" }' "$migrated/AGENTS.md"
          ! grep -q 'homePath' "$migrated/server/plugins/config.ts"
          assert_idempotent "$migrated"
