name: Create template snapshot

on:
  workflow_dispatch:
    inputs:
      sourceCommitSha:
        description: Full commit SHA pushed to main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: create-agent-native-starter-template-snapshot
  cancel-in-progress: false

jobs:
  request-snapshot:
    name: Request Golden Snapshot
    runs-on: ubuntu-latest
    env:
      API_URL: https://api.builder.io/projects/bffe4b2ed2f34eafaf69/snapshots
      GOLDEN_TEMPLATE_ID: agent-native-starter
      BUILDER_PROJECT_API_KEY: ${{ secrets.BUILDER_PROJECT_API_KEY }}
      BUILDER_SUPERUSER_TOKEN: ${{ secrets.BUILDER_SUPERUSER_TOKEN }}
      SOURCE_COMMIT_SHA: ${{ inputs.sourceCommitSha }}
    steps:
      - name: Submit snapshot request
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BUILDER_PROJECT_API_KEY:-}" ]; then
            echo "::error::Required repository secret BUILDER_PROJECT_API_KEY is not configured."
            exit 1
          fi
          if [ -z "${BUILDER_SUPERUSER_TOKEN:-}" ]; then
            echo "::error::Required repository secret BUILDER_SUPERUSER_TOKEN is not configured."
            exit 1
          fi
          if [[ ! "$SOURCE_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::sourceCommitSha must be a full 40-character hexadecimal commit SHA."
            exit 1
          fi

          api_key_encoded=$(jq -rn --arg value "$BUILDER_PROJECT_API_KEY" '$value | @uri')
          template_id_encoded=$(jq -rn --arg value "$GOLDEN_TEMPLATE_ID" '$value | @uri')
          request_url="${API_URL}?apiKey=${api_key_encoded}&goldenTemplateId=${template_id_encoded}"
          request_body=$(jq -cn --arg sourceCommitSha "$SOURCE_COMMIT_SHA" '{sourceCommitSha: $sourceCommitSha}')

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${BUILDER_SUPERUSER_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$request_body" \
            "$request_url")

          trigger_event_id=$(jq -er '.triggerEventId | select(type == "string" and length > 0)' <<<"$response")
          check_run_id=$(jq -er '.checkRunId | select(type == "number" and . > 0 and . == floor)' <<<"$response")

          {
            echo "## Golden Snapshot request accepted"
            echo
            echo "The backend accepted trigger \`$trigger_event_id\` and created Golden Snapshot check run \`$check_run_id\`."
            echo "Final status will appear in the **Golden Snapshot** check and Slack."
          } >> "$GITHUB_STEP_SUMMARY"
